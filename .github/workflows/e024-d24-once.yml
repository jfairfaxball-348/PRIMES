name: E024 D24 single-authorized exact replay
on:
  push:
    paths:
      - research/checkpoints/E024_D1_69_D24_AUTHORIZE_ONESHOT.md
permissions:
  contents: write
jobs:
  d24-only:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check remotely precommitted entire source tests full command and no-generator PASS
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/E024_binary_grassmannian_rank_residue_order_shapes.py)" = "7ab7e5c7ce24db42296dc9dc06695dd575335d43"
          test "$(git hash-object tests/test_e023.py)" = "2afafa485c7ec38217ab2051c1da8d761242420c"
          test "$(git hash-object research/checkpoints/E024_D1_69_D24_RUN_COMMAND.md)" = "ab78728b50014a00cadd747aede3f8b64c98e87b"
          test "$(git hash-object research/checkpoints/E024_D1_69_PREFLIGHT_PASS.md)" = "9315562f88b74859b5a02d000c0c2aab598edf8c"
          printf '%s\n' 'PYTHONPATH=.:src python experiments/E024_binary_grassmannian_rank_residue_order_shapes.py --band D24 --code-commit 23a4ef9c170b169d1662f4b770b1cbf50e9ff693 --output /tmp/e024-d24.json' | cmp - research/checkpoints/E024_D1_69_D24_RUN_COMMAND.md
          test "$(git rev-parse HEAD:experiments/E024_binary_grassmannian_rank_residue_order_shapes.py)" = "7ab7e5c7ce24db42296dc9dc06695dd575335d43"
          test "$(git rev-parse HEAD:tests/test_e023.py)" = "2afafa485c7ec38217ab2051c1da8d761242420c"
      - name: Complete independent synthetic, provenance and exhaustive generator poisons before any generator
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet -e ".[dev]"
          ruff check experiments/E024_binary_grassmannian_rank_residue_order_shapes.py tests/test_e023.py
          python -m compileall -q experiments/E024_binary_grassmannian_rank_residue_order_shapes.py tests/test_e023.py
          PYTHONPATH=.:src python -m pytest -q tests/test_e023.py
          PYTHONPATH=.:src python - <<'PY'
          from experiments import E024_binary_grassmannian_rank_residue_order_shapes as e
          from math import isqrt
          assert e.audit_intervals() == dict(old_old=6441,new_old=570,new_new=10,new_nested=150,old_non_e005_nested=3240,nested_contained=30,nested_within=60,nested_across=375)
          assert len(e.prior_roles()) == 114 and len(e.E005_STARTS)*len(e.E005_WIDTHS) == 30 and len(e.ROLES) == 5
          assert e.PLAN == (("base_sieve_support",0,13639,"whole_prefix"),("segmented_target",184000000,186000000,"direct_segmented"))
          assert isqrt(186000000-1)+1 == 13639
          assert e.self_checks() == (0,0,0)
          gate=e.GeneratorGate()
          gate.enter(0,*e.PLAN[0])
          gate.enter(1,*e.PLAN[1])
          gate.finished()
          for off in ("H24","A24","G24-pre","G24-mid","D22","D21","D20","H19"):
              try:
                  e.GeneratorGate(phase=off)
              except ValueError:
                  pass
              else:
                  raise AssertionError("off-phase positive path")
          print("PREGEN PASS: 114 individually named old, 30 individually barred nested, five E024 roles; first eligible allocation; all 10 validators synthetic semantics; complete guarded plan")
          PY
      - name: Run the identical complete pinned command exactly twice; seal first raw uninterpreted
        shell: bash
        run: |
          set -euo pipefail
          test ! -e /tmp/e024-d24.json
          PYTHONPATH=.:src python experiments/E024_binary_grassmannian_rank_residue_order_shapes.py --band D24 --code-commit 23a4ef9c170b169d1662f4b770b1cbf50e9ff693 --output /tmp/e024-d24.json
          cp /tmp/e024-d24.json /tmp/e024-d24.first.sealed.raw
          sha256sum /tmp/e024-d24.first.sealed.raw > /tmp/e024-d24.first.sha256
          PYTHONPATH=.:src python experiments/E024_binary_grassmannian_rank_residue_order_shapes.py --band D24 --code-commit 23a4ef9c170b169d1662f4b770b1cbf50e9ff693 --output /tmp/e024-d24.json
          cmp /tmp/e024-d24.first.sealed.raw /tmp/e024-d24.json
          sha256sum /tmp/e024-d24.json > /tmp/e024-d24.second.sha256
          test "$(cut -d' ' -f1 /tmp/e024-d24.first.sha256)" = "$(cut -d' ' -f1 /tmp/e024-d24.second.sha256)"
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          first=Path("/tmp/e024-d24.first.sealed.raw").read_bytes()
          second=Path("/tmp/e024-d24.json").read_bytes()
          assert first == second
          x,y=sha256(first).hexdigest(),sha256(second).hexdigest()
          assert x == y
          assert x == Path("/tmp/e024-d24.first.sha256").read_text().split()[0]
          assert y == Path("/tmp/e024-d24.second.sha256").read_text().split()[0]
          print("WHOLE RAW REPLAY VERIFIED", len(first), "bytes; independently confirmed SHA256",x)
          PY
      - name: Parse ONLY strict ten-key canonical typed aggregate AFTER full replay
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=.:src python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          from experiments import E024_binary_grassmannian_rank_residue_order_shapes as e
          raw=Path("/tmp/e024-d24.json").read_bytes()
          obj=json.loads(raw.decode("ascii"))
          assert e.canonical(obj) == raw and e.validate_payload(obj)
          assert set(obj)==e.TOP_FIELDS and len(obj)==10
          assert obj["implementation_commit"]=="23a4ef9c170b169d1662f4b770b1cbf50e9ff693"
          assert obj["band"]["name"]=="D24" and obj["generation_plan"]==e.plan_dicts()
          assert set(obj["validation"])==set(e.VALIDATORS)
          assert all(type(x) is int and x == 0 for x in obj["validation"].values())
          f=obj["families"][0]
          assert bool(obj["promotions"]) == f["mechanically_eligible"]
          Path("research/evidence/E024_D24_discovery.json").write_bytes(raw)
          summary=(
            "E024 D1-67 D24 WHOLE REPLAY AND STRICT CANONICAL EVIDENCE PASS\n"
            "Full source/test pre-generation implementation commit 23a4ef9c170b169d1662f4b770b1cbf50e9ff693\n"
            "Source blob 7ab7e5c7ce24db42296dc9dc06695dd575335d43\n"
            "Test blob 2afafa485c7ec38217ab2051c1da8d761242420c\n"
            "Full literal executable command blob ab78728b50014a00cadd747aede3f8b64c98e87b\n"
            f"Full raw bytes {len(raw)}; SHA256 {sha256(raw).hexdigest()}\n"
            "Both identical entire commands run once each; first raw sealed; full cmp and external and independent SHA-256 equal before parsing\n"
            "All ten distinct typed zero validators passed; no other artifact fields\n"
            f"Gate disposition: {'ELIGIBLE F1' if f['mechanically_eligible'] else 'NO ELIGIBLE OBSERVATION'}\n"
            "D24 only; guards H24 A24 and every old role not generated\n"
          )
          Path("research/checkpoints/E024_D1_69_D24_EXECUTION_PASS.md").write_text(summary,encoding="ascii")
          print(summary)
          print("D24 NARROW CANONICAL AGGREGATE:", raw.decode("ascii"))
          PY
      - name: Persist only narrow aggregate and provenance after exact replay
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/evidence/E024_D24_discovery.json research/checkpoints/E024_D1_69_D24_EXECUTION_PASS.md
          git commit -m "D1-67 seal D24 canonical aggregate after complete two-run byte replay"
          git push origin HEAD:main
