name: e005-phase-a

on:
  push:
    branches: [main]

jobs:
  development:
    if: "github.event.head_commit.message == 'D1-12: rerun E005 Phase A'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned implementation
        run: |
          test "$(git rev-parse HEAD:experiments/E005_prime_count_scale_calibration.py)" = "894ebe08f4713d254faecdfd653660d2c011bb3a"
          test "$(git rev-parse HEAD:tests/test_e005.py)" = "8d74e7b809cbf69bc234af0c94abc53e77125259"
      - name: Run development twice
        run: |
          python experiments/E005_prime_count_scale_calibration.py --phase development --code-commit 5b8646ea82ca6d3c08b60f75759d16c101f6a0fc --output /tmp/e005-development-a.json --checkpoint-output /tmp/e005-development-checkpoint-a.json
          python experiments/E005_prime_count_scale_calibration.py --phase development --code-commit 5b8646ea82ca6d3c08b60f75759d16c101f6a0fc --output /tmp/e005-development-b.json --checkpoint-output /tmp/e005-development-checkpoint-b.json
          cmp /tmp/e005-development-a.json /tmp/e005-development-b.json
          cmp /tmp/e005-development-checkpoint-a.json /tmp/e005-development-checkpoint-b.json
          wc -c /tmp/e005-development-a.json /tmp/e005-development-checkpoint-a.json > /tmp/e005-development-metadata.txt
          sha256sum /tmp/e005-development-a.json /tmp/e005-development-checkpoint-a.json >> /tmp/e005-development-metadata.txt
          printf 'byte_identity_full=true\nbyte_identity_checkpoint=true\nimplementation_commit=5b8646ea82ca6d3c08b60f75759d16c101f6a0fc\n' >> /tmp/e005-development-metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: e005-phase-a
          path: |
            /tmp/e005-development-a.json
            /tmp/e005-development-checkpoint-a.json
            /tmp/e005-development-metadata.txt
          if-no-files-found: error
