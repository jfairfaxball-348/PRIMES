name: E025 H25 exact one-shot fixed-target two-run replication
on:
  push:
    paths:
      - research/checkpoints/E025_D1_72_H25_AUTHORIZE.md

permissions:
  contents: read

jobs:
  h25-once:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Immutable H25 source/tests/complete command and criterion remote gate BEFORE generation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/e025_h25_three_row_young_tableau_linear_extension_remainder_octiles.py)" = e6812c6ce274555d5deee0de7633b45a021f04d3
          test "$(git hash-object tests/test_e025_h25.py)" = b3eeebd0844e394bad12f0726fcbc3e9cb6b294a
          test "$(git hash-object research/checkpoints/E025_D1_72_H25_RUN_COMMAND.md)" = b8d168dcc477c6db3c008aefb250088bd36a033a
          python -m pip install --disable-pip-version-check pytest ruff
          ruff check experiments/e025_h25_three_row_young_tableau_linear_extension_remainder_octiles.py tests/test_e025_h25.py
          python -m py_compile experiments/e025_h25_three_row_young_tableau_linear_extension_remainder_octiles.py tests/test_e025_h25.py
          python -m pytest tests/test_e025_h25.py -q
          python - <<'PY'
          from pathlib import Path
          from math import isqrt
          from experiments.e025_h25_three_row_young_tableau_linear_extension_remainder_octiles import (
              assert_plan, PLAN, LOW, HIGH, BASE_STOP, PARTITION, audit_named_intervals,
              independent_small_checks, independent_triviality_veto
          )
          pinned = "python experiments/e025_h25_three_row_young_tableau_linear_extension_remainder_octiles.py --phase H25 --implementation-commit 56bbdeb37d504ad429ab0095440aafddfadd15b7 --output /tmp/e025_h25_raw.json"
          exact = Path("research/checkpoints/E025_D1_72_H25_RUN_COMMAND.md").read_bytes()
          if exact != (pinned + "\n").encode("ascii"):
              raise PermissionError("entire H25 command not independently pinned")
          workflow = Path(".github/workflows/e025-h25-once.yml").read_text()
          if [line.strip() for line in workflow.splitlines()].count(pinned) != 2:
              raise PermissionError("EXACTLY TWO entire literal H25 commands required")
          spec = Path("experiments/E025_THREE_ROW_YOUNG_TABLEAU_LINEAR_EXTENSION_REMAINDER_OCTILES.md").read_text()
          ledger = Path("research/OBSERVATION_LEDGER.md").read_text()
          marker="## 5. Complete frozen conditional H25 one-shot REFUTATION template"
          frozen = marker + spec.split(marker,1)[1].split("## 6.",1)[0]
          observed = marker + ledger.split("### OBS-025",1)[1].split(marker,1)[1].split("**Permanent S073 stop:**",1)[0]
          if frozen.strip() != observed.strip():
              raise PermissionError("OBS-025 one-shot H25 criterion differs from original source-free section 5")
          if "**Frozen target:** Exactly integer **t*=0**" not in ledger.split("### OBS-025",1)[1]:
              raise PermissionError("D25 frozen target 0 missing")
          if len(audit_named_intervals(spec)) != 149 or isqrt(HIGH-1) != 14696:
              raise PermissionError("119 + 30 named role metadata or low support invalid")
          if (BASE_STOP,LOW,HIGH) != (14697,214000000,216000000) or PARTITION[3][0] != "H25":
              raise PermissionError("phase exact endpoints mismatch")
          assert_plan(PLAN,spec,"H25")
          independent_small_checks()
          if not independent_triviality_veto():
              raise PermissionError("label-blind mathematical veto failed")
          print("H25_PREGEN_COMPLETE_IMMUTABLE_GATE_PASS")
          PY
      - name: Execute complete command TWICE, seal first raw, compare full bytes and independent whole SHA256 BEFORE JSON
        shell: bash
        run: |
          set -euo pipefail
          python experiments/e025_h25_three_row_young_tableau_linear_extension_remainder_octiles.py --phase H25 --implementation-commit 56bbdeb37d504ad429ab0095440aafddfadd15b7 --output /tmp/e025_h25_raw.json
          cp -- /tmp/e025_h25_raw.json /tmp/e025_h25_raw_first.sealed
          sha256sum /tmp/e025_h25_raw_first.sealed > /tmp/e025_h25_first.digest_only
          python experiments/e025_h25_three_row_young_tableau_linear_extension_remainder_octiles.py --phase H25 --implementation-commit 56bbdeb37d504ad429ab0095440aafddfadd15b7 --output /tmp/e025_h25_raw.json
          cmp -- /tmp/e025_h25_raw_first.sealed /tmp/e025_h25_raw.json
          EXTERNAL_FIRST="$(sha256sum /tmp/e025_h25_raw_first.sealed | cut -d ' ' -f1)"
          EXTERNAL_SECOND="$(sha256sum /tmp/e025_h25_raw.json | cut -d ' ' -f1)"
          test "$EXTERNAL_FIRST" = "$EXTERNAL_SECOND"
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          first = Path("/tmp/e025_h25_raw_first.sealed").read_bytes()
          second = Path("/tmp/e025_h25_raw.json").read_bytes()
          if first != second or sha256(first).digest() != sha256(second).digest():
              raise ArithmeticError("whole raw file bytes and independent SHA256 differ")
          print("E025_H25_FULL_REPLAY_EQUAL_BYTES",len(first))
          print("E025_H25_FULL_REPLAY_SHA256",sha256(first).hexdigest())
          PY
      - name: Interpret ONLY fixed target zero strict canonical narrow aggregate AFTER complete replay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          from experiments.e025_h25_three_row_young_tableau_linear_extension_remainder_octiles import canonical,payload_schema
          raw=Path("/tmp/e025_h25_raw.json").read_bytes()
          def unique_pairs(pairs):
              out={}
              for k,v in pairs:
                  if k in out: raise ValueError("duplicate JSON key")
                  out[k]=v
              return out
          obj=json.loads(raw,object_pairs_hook=unique_pairs,
                         parse_constant=lambda _: (_ for _ in ()).throw(ValueError("nonfinite")))
          payload_schema(obj)
          if canonical(obj)!=raw: raise ValueError("noncanonical full typed ASCII evidence")
          f=obj["families"][0]
          if f["evaluated_signature"] != 0 or obj["promotions"] != []:
              raise ArithmeticError("H25 retargeting or promotion")
          print("E025_H25_CANONICAL_AGGREGATE_BEGIN")
          print(raw.decode("ascii"),end="")
          print("E025_H25_CANONICAL_AGGREGATE_END")
          print("E025_H25_FROZEN_CRITERION", "REPLICATED" if f["mechanically_eligible"] else "REFUTED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e025-h25-once-raw-verified
          path: /tmp/e025_h25_raw.json
          if-no-files-found: error
          retention-days: 30
