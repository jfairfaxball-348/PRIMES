name: RS-S037 independent Comparator and NanoDa
on:
  push:
    branches: [rs-s035-palomar-coverage, rs-s036-comparator-fidelity, rs-s037-sextic-aux-fidelity]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  independently-check:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Lean library and Mathlib setup
        run: bash formalisation/cloud_setup.sh
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: false
      - name: Pin and install independent verifier tools
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p .ci
          go install github.com/zouuup/landrun/cmd/landrun@5ed4a3db3a4ad930d577215c6b9abaa19df7f99f
          git clone https://github.com/leanprover/lean4export.git .ci/lean4export
          git -C .ci/lean4export checkout 076e8e57707e813375e8f9da8bf989799ace9680
          cp formalisation/lean-toolchain .ci/lean4export/lean-toolchain
          (cd .ci/lean4export && lake build lean4export)
          git clone https://github.com/leanprover/comparator.git .ci/comparator
          git -C .ci/comparator checkout d03acab154d269c06e60e4de7e4cc85deebff94b
          cp formalisation/lean-toolchain .ci/comparator/lean-toolchain
          (cd .ci/comparator && lake build comparator)
          git clone https://github.com/robsimmons/nanoda_lib.git .ci/nanoda
          git -C .ci/nanoda checkout 68d5ca9db226849b41a6fff59d796ff19d0a8840
          (cd .ci/nanoda && cargo build --release)
      - name: Diagnose exported frozen shiftedGauss elaboration (no checker bypass)
        working-directory: formalisation
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build Challenge Solution > /tmp/rs036_build.log 2>&1 || { tail -80 /tmp/rs036_build.log; exit 1; }
          printf 'import Challenge\nset_option pp.all true\n#print ReciprocitySpectra.shiftedGauss\n#print ReciprocitySpectra.shiftedGauss._proof_1\n#print ReciprocitySpectra.sexticCharacter\n' > /tmp/Rs036Challenge.lean
          printf 'import Solution\nset_option pp.all true\n#print ReciprocitySpectra.shiftedGauss\n#print ReciprocitySpectra.shiftedGauss._proof_1\n#print ReciprocitySpectra.sexticCharacter\n' > /tmp/Rs036Solution.lean
          lake env lean /tmp/Rs036Challenge.lean > /tmp/rs036_challenge.txt
          lake env lean /tmp/Rs036Solution.lean > /tmp/rs036_solution.txt
          python3 - <<'PY'
          import difflib
          from pathlib import Path
          c = Path('/tmp/rs036_challenge.txt').read_text()
          s = Path('/tmp/rs036_solution.txt').read_text()
          print('Selected constant print lengths:', len(c), len(s))
          diff = list(difflib.unified_diff(c.splitlines(), s.splitlines(), fromfile='CHALLENGE', tofile='SOLUTION', lineterm=''))
          print('Total differing lines:', len(diff))
          print('\n'.join(diff[:140]))
          PY
          cat > /tmp/Rs036ChallengeAux.lean <<'LEAN'
          import Challenge
          set_option pp.all true
          #print ReciprocitySpectra.rawGauss._proof_1
          #print ReciprocitySpectra.complexZeta6._proof_1
          LEAN
          cat > /tmp/Rs036SolutionAux.lean <<'LEAN'
          import Solution
          set_option pp.all true
          #print ReciprocitySpectra.sexticCharacter._proof_2
          #print ReciprocitySpectra.sexticCharacter._proof_3
          LEAN
          lake env lean /tmp/Rs036ChallengeAux.lean > /tmp/rs036_aux_challenge.txt 2>&1 || echo 'Challenge auxiliary print could not resolve one or more names'
          lake env lean /tmp/Rs036SolutionAux.lean > /tmp/rs036_aux_solution.txt 2>&1 || echo 'Solution auxiliary print could not resolve one or more names'
          echo 'SOURCE character auxiliary proofs:'
          cat /tmp/rs036_aux_solution.txt
          echo 'CHALLENGE unrelated-name auxiliaries:'
          cat /tmp/rs036_aux_challenge.txt
      - name: Independently compare all selected proofs (with NanoDa)
        working-directory: formalisation
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$HOME/go/bin:$GITHUB_WORKSPACE/.ci/nanoda/target/release:$PATH"
          export COMPARATOR_LANDRUN="$HOME/go/bin/landrun"
          export COMPARATOR_LEAN4EXPORT="$GITHUB_WORKSPACE/.ci/lean4export/.lake/build/bin/lean4export"
          export COMPARATOR_NANODA="$GITHUB_WORKSPACE/.ci/nanoda/target/release/nanoda_bin"
          lake env "$GITHUB_WORKSPACE/.ci/comparator/.lake/build/bin/comparator" comparator.json
