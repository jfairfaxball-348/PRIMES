name: RS-S039 independent Comparator and NanoDa
on:
  push:
    branches: [rs-s035-palomar-coverage, rs-s036-comparator-fidelity, rs-s037-sextic-aux-fidelity, rs-s038-direct-shift-fidelity, rs-s039-addchar-fidelity]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  independently-check:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Lean library and Mathlib setup
        run: bash formalisation/cloud_setup.sh
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: false
      - name: Pin and install independent verifier tools
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p .ci
          go install github.com/zouuup/landrun/cmd/landrun@5ed4a3db3a4ad930d577215c6b9abaa19df7f99f
          git clone https://github.com/leanprover/lean4export.git .ci/lean4export
          git -C .ci/lean4export checkout 076e8e57707e813375e8f9da8bf989799ace9680
          cp formalisation/lean-toolchain .ci/lean4export/lean-toolchain
          (cd .ci/lean4export && lake build lean4export)
          git clone https://github.com/leanprover/comparator.git .ci/comparator
          git -C .ci/comparator checkout d03acab154d269c06e60e4de7e4cc85deebff94b
          cp formalisation/lean-toolchain .ci/comparator/lean-toolchain
          (cd .ci/comparator && lake build comparator)
          git clone https://github.com/robsimmons/nanoda_lib.git .ci/nanoda
          git -C .ci/nanoda checkout 68d5ca9db226849b41a6fff59d796ff19d0a8840
          (cd .ci/nanoda && cargo build --release)
      - name: Diagnose full exported rationalAddChar type and body on both independent modules
        working-directory: formalisation
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build Challenge Solution > /tmp/rs039_build.log 2>&1 || { tail -80 /tmp/rs039_build.log; exit 1; }
          printf 'import Challenge\nset_option pp.all true\n#print ReciprocitySpectra.rationalAddChar\n' > /tmp/Rs039Challenge.lean
          printf 'import Solution\nset_option pp.all true\n#print ReciprocitySpectra.rationalAddChar\n' > /tmp/Rs039Solution.lean
          lake env lean /tmp/Rs039Challenge.lean > /tmp/rs039_challenge.txt
          lake env lean /tmp/Rs039Solution.lean > /tmp/rs039_solution.txt
          python3 - <<'PY'
          import difflib
          from pathlib import Path
          c = Path('/tmp/rs039_challenge.txt').read_text().splitlines()
          s = Path('/tmp/rs039_solution.txt').read_text().splitlines()
          print('rationalAddChar exported constant: challenge lines=', len(c), 'source lines=',len(s))
          changes = list(difflib.unified_diff(c, s, fromfile='CHALLENGE', tofile='SOURCE', n=5, lineterm=''))
          print('Full exact type/body diff:', len(changes), 'lines')
          print('\n'.join(changes[:220]))
          PY
          for side in Challenge Solution; do
            printf 'import %s\nset_option pp.all true\n#print ReciprocitySpectra.rationalAddChar._proof_1\n' "$side" > /tmp/Rs039Aux.lean
            lake env lean /tmp/Rs039Aux.lean > "/tmp/rs039_aux_$side.txt" 2>&1 || true
            echo "== $side generated auxiliary witness if present =="
            tail -30 "/tmp/rs039_aux_$side.txt"
          done
      - name: Independently compare all selected proofs (with NanoDa)
        working-directory: formalisation
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$HOME/go/bin:$GITHUB_WORKSPACE/.ci/nanoda/target/release:$PATH"
          export COMPARATOR_LANDRUN="$HOME/go/bin/landrun"
          export COMPARATOR_LEAN4EXPORT="$GITHUB_WORKSPACE/.ci/lean4export/.lake/build/bin/lean4export"
          export COMPARATOR_NANODA="$GITHUB_WORKSPACE/.ci/nanoda/target/release/nanoda_bin"
          lake env "$GITHUB_WORKSPACE/.ci/comparator/.lake/build/bin/comparator" comparator.json
