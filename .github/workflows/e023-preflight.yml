name: E023 D23 generator-free synthetic preflight
on:
  push:
    paths:
      - experiments/E023_distinct_summand_partition_triangular_shell_rank_shapes.py
      - tests/test_e023.py
      - .github/workflows/e023-preflight.yml
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused tooling
        run: python -m pip install -e ".[dev]"
      - name: Lint immutable E023 source and independent tests
        run: ruff check experiments/E023_distinct_summand_partition_triangular_shell_rank_shapes.py tests/test_e023.py
      - name: Compile and test WITHOUT generator
        run: |
          python -m compileall -q experiments/E023_distinct_summand_partition_triangular_shell_rank_shapes.py tests/test_e023.py
          PYTHONPATH=.:src python -m pytest -q tests/test_e023.py
