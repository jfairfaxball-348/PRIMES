name: RS-S041 Paper Build
on:
  push:
    branches: [rs-s041-paper-draft]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install plotting and lint dependencies
        run: python -m pip install numpy matplotlib ruff
      - name: Python syntax and touched-script lint
        run: |
          python -m compileall -q paper/figures
          ruff check paper/figures/make_all.py
      - name: Generate all committed-source charts
        run: python paper/figures/make_all.py
      - name: Verify fourteen generated PDF and PNG pairs
        run: |
          test "$(find paper/figures/generated -maxdepth 1 -name '*.pdf' | wc -l)" -eq 14
          test "$(find paper/figures/generated -maxdepth 1 -name '*.png' | wc -l)" -eq 14
      - name: Install TeX
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - name: Compile paper
        run: make -C paper main.pdf
      - name: Upload first-draft PDF and figure previews
        uses: actions/upload-artifact@v4
        with:
          name: rs-s041-paper-preview
          path: |
            paper/main.pdf
            paper/figures/generated/*.png
          retention-days: 14
