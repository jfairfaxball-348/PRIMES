name: E023 D23 single-authorized exact replay
on:
  push:
    paths:
      - research/checkpoints/E023_D1_67_D23_AUTHORIZE_ONESHOT.md
permissions:
  contents: write
jobs:
  d23-only:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check remotely precommitted entire source tests full command and no-generator PASS
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/E023_distinct_summand_partition_triangular_shell_rank_shapes.py)" = "7717c6a05444263b497a71d50196c3886dd04b80"
          test "$(git hash-object tests/test_e023.py)" = "e67621afbdf8d0ca3c47afe4c3a8ffe7af2d05fe"
          test "$(git hash-object research/checkpoints/E023_D1_67_D23_RUN_COMMAND.md)" = "d01efc0a8780352e4d5022b0a0c686de8ae6f540"
          test "$(git hash-object research/checkpoints/E023_D1_67_PREFLIGHT_PASS.md)" = "1d531160b2bd6de842780c00ab957971f7de84fe"
          printf '%s\n' 'PYTHONPATH=.:src python experiments/E023_distinct_summand_partition_triangular_shell_rank_shapes.py --band D23 --code-commit 476b92c322ff374ace6b0cd7e0787a5e26605776 --output /tmp/e023-d23.json' | cmp - research/checkpoints/E023_D1_67_D23_RUN_COMMAND.md
          test "$(git rev-parse HEAD:experiments/E023_distinct_summand_partition_triangular_shell_rank_shapes.py)" = "7717c6a05444263b497a71d50196c3886dd04b80"
          test "$(git rev-parse HEAD:tests/test_e023.py)" = "e67621afbdf8d0ca3c47afe4c3a8ffe7af2d05fe"
      - name: Complete independent synthetic, provenance and exhaustive generator poisons before any generator
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet -e ".[dev]"
          ruff check experiments/E023_distinct_summand_partition_triangular_shell_rank_shapes.py tests/test_e023.py
          python -m compileall -q experiments/E023_distinct_summand_partition_triangular_shell_rank_shapes.py tests/test_e023.py
          PYTHONPATH=.:src python -m pytest -q tests/test_e023.py
          PYTHONPATH=.:src python - <<'PY'
          from experiments import E023_distinct_summand_partition_triangular_shell_rank_shapes as e
          from math import isqrt
          assert e.audit_intervals() == dict(old_old=5886,new_old=545,new_new=10,new_nested=150,old_non_e005_nested=3090,nested_contained=30,nested_within=60,nested_across=375)
          assert len(e.prior_roles()) == 109 and len(e.E005_STARTS)*len(e.E005_WIDTHS) == 30 and len(e.ROLES) == 5
          assert e.PLAN == (("base_sieve_support",0,12962,"whole_prefix"),("segmented_target",166000000,168000000,"direct_segmented"))
          assert isqrt(168000000-1)+1 == 12962
          assert e.self_checks() == (0,0,0)
          gate=e.GeneratorGate()
          gate.enter(0,*e.PLAN[0])
          gate.enter(1,*e.PLAN[1])
          gate.finished()
          for off in ("H23","A23","G23-pre","G23-mid","D22","D21","D20","H19"):
              try:
                  e.GeneratorGate(phase=off)
              except ValueError:
                  pass
              else:
                  raise AssertionError("off-phase positive path")
          print("PREGEN PASS: 109 individually named old, 30 individually barred nested, five E023 roles; first eligible allocation; all 10 validators synthetic semantics; complete guarded plan")
          PY
      - name: Run the identical complete pinned command exactly twice; seal first raw uninterpreted
        shell: bash
        run: |
          set -euo pipefail
          test ! -e /tmp/e023-d23.json
          PYTHONPATH=.:src python experiments/E023_distinct_summand_partition_triangular_shell_rank_shapes.py --band D23 --code-commit 476b92c322ff374ace6b0cd7e0787a5e26605776 --output /tmp/e023-d23.json
          cp /tmp/e023-d23.json /tmp/e023-d23.first.sealed.raw
          sha256sum /tmp/e023-d23.first.sealed.raw > /tmp/e023-d23.first.sha256
          PYTHONPATH=.:src python experiments/E023_distinct_summand_partition_triangular_shell_rank_shapes.py --band D23 --code-commit 476b92c322ff374ace6b0cd7e0787a5e26605776 --output /tmp/e023-d23.json
          cmp /tmp/e023-d23.first.sealed.raw /tmp/e023-d23.json
          sha256sum /tmp/e023-d23.json > /tmp/e023-d23.second.sha256
          test "$(cut -d' ' -f1 /tmp/e023-d23.first.sha256)" = "$(cut -d' ' -f1 /tmp/e023-d23.second.sha256)"
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          first=Path("/tmp/e023-d23.first.sealed.raw").read_bytes()
          second=Path("/tmp/e023-d23.json").read_bytes()
          assert first == second
          x,y=sha256(first).hexdigest(),sha256(second).hexdigest()
          assert x == y
          assert x == Path("/tmp/e023-d23.first.sha256").read_text().split()[0]
          assert y == Path("/tmp/e023-d23.second.sha256").read_text().split()[0]
          print("WHOLE RAW REPLAY VERIFIED", len(first), "bytes; independently confirmed SHA256",x)
          PY
      - name: Parse ONLY strict ten-key canonical typed aggregate AFTER full replay
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=.:src python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          from experiments import E023_distinct_summand_partition_triangular_shell_rank_shapes as e
          raw=Path("/tmp/e023-d23.json").read_bytes()
          obj=json.loads(raw.decode("ascii"))
          assert e.canonical(obj) == raw and e.validate_payload(obj)
          assert set(obj)==e.TOP_FIELDS and len(obj)==10
          assert obj["implementation_commit"]=="476b92c322ff374ace6b0cd7e0787a5e26605776"
          assert obj["band"]["name"]=="D23" and obj["generation_plan"]==e.plan_dicts()
          assert set(obj["validation"])==set(e.VALIDATORS)
          assert all(type(x) is int and x == 0 for x in obj["validation"].values())
          f=obj["families"][0]
          assert bool(obj["promotions"]) == f["mechanically_eligible"]
          Path("research/evidence/E023_D23_discovery.json").write_bytes(raw)
          summary=(
            "E023 D1-67 D23 WHOLE REPLAY AND STRICT CANONICAL EVIDENCE PASS\n"
            "Full source/test pre-generation implementation commit 476b92c322ff374ace6b0cd7e0787a5e26605776\n"
            "Source blob 7717c6a05444263b497a71d50196c3886dd04b80\n"
            "Test blob e67621afbdf8d0ca3c47afe4c3a8ffe7af2d05fe\n"
            "Full literal executable command blob d01efc0a8780352e4d5022b0a0c686de8ae6f540\n"
            f"Full raw bytes {len(raw)}; SHA256 {sha256(raw).hexdigest()}\n"
            "Both identical entire commands run once each; first raw sealed; full cmp and external and independent SHA-256 equal before parsing\n"
            "All ten distinct typed zero validators passed; no other artifact fields\n"
            f"Gate disposition: {'ELIGIBLE P1' if f['mechanically_eligible'] else 'NO ELIGIBLE OBSERVATION'}\n"
            "D23 only; guards H23 A23 and every old role not generated\n"
          )
          Path("research/checkpoints/E023_D1_67_D23_EXECUTION_PASS.md").write_text(summary,encoding="ascii")
          print(summary)
          print("D23 NARROW CANONICAL AGGREGATE:", raw.decode("ascii"))
          PY
      - name: Persist only narrow aggregate and provenance after exact replay
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/evidence/E023_D23_discovery.json research/checkpoints/E023_D1_67_D23_EXECUTION_PASS.md
          git commit -m "D1-67 seal D23 canonical aggregate after complete two-run byte replay"
          git push origin HEAD:main
