name: e005-phase-b

on:
  push:
    branches: [main]

jobs:
  assessment:
    if: "github.event.head_commit.message == 'D1-12: execute E005 Phase B'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen implementation and committed development checkpoint
        run: |
          test "$(git rev-parse HEAD:experiments/E005_prime_count_scale_calibration.py)" = "894ebe08f4713d254faecdfd653660d2c011bb3a"
          test "$(git rev-parse HEAD:tests/test_e005.py)" = "8d74e7b809cbf69bc234af0c94abc53e77125259"
          test "$(git rev-parse HEAD^)" = "8bf4821106e4c5c3acc79bfadc85c2872797935e"
          printf '%s  %s\n' "8a61a5b0e2ceca49f5af06f26970c37808cacc2d55c82bbcfd0eb87f6434b401" "research/evidence/E005_development_selection.json" | sha256sum -c -
      - name: Run assessment twice
        run: |
          python experiments/E005_prime_count_scale_calibration.py --phase assessment --code-commit 5b8646ea82ca6d3c08b60f75759d16c101f6a0fc --output /tmp/e005-assessment-a.json --checkpoint-output /tmp/e005-assessment-checkpoint-a.json --development-record research/evidence/E005_development_selection.json --development-record-sha256 8a61a5b0e2ceca49f5af06f26970c37808cacc2d55c82bbcfd0eb87f6434b401 --development-record-commit 8bf4821106e4c5c3acc79bfadc85c2872797935e
          python experiments/E005_prime_count_scale_calibration.py --phase assessment --code-commit 5b8646ea82ca6d3c08b60f75759d16c101f6a0fc --output /tmp/e005-assessment-b.json --checkpoint-output /tmp/e005-assessment-checkpoint-b.json --development-record research/evidence/E005_development_selection.json --development-record-sha256 8a61a5b0e2ceca49f5af06f26970c37808cacc2d55c82bbcfd0eb87f6434b401 --development-record-commit 8bf4821106e4c5c3acc79bfadc85c2872797935e
          cmp /tmp/e005-assessment-a.json /tmp/e005-assessment-b.json
          cmp /tmp/e005-assessment-checkpoint-a.json /tmp/e005-assessment-checkpoint-b.json
          wc -c /tmp/e005-assessment-a.json /tmp/e005-assessment-checkpoint-a.json > /tmp/e005-assessment-metadata.txt
          sha256sum /tmp/e005-assessment-a.json /tmp/e005-assessment-checkpoint-a.json >> /tmp/e005-assessment-metadata.txt
          printf 'byte_identity_full=true\nbyte_identity_checkpoint=true\nimplementation_commit=5b8646ea82ca6d3c08b60f75759d16c101f6a0fc\ndevelopment_record_commit=8bf4821106e4c5c3acc79bfadc85c2872797935e\ndevelopment_record_sha256=8a61a5b0e2ceca49f5af06f26970c37808cacc2d55c82bbcfd0eb87f6434b401\n' >> /tmp/e005-assessment-metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: e005-phase-b
          path: |
            /tmp/e005-assessment-a.json
            /tmp/e005-assessment-checkpoint-a.json
            /tmp/e005-assessment-metadata.txt
          if-no-files-found: error
