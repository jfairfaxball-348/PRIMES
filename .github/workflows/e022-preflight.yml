name: E022 synthetic and generator-firewall preflight
on:
  push:
    paths:
      - experiments/E022_proper_cycle_colouring_residue_order_shapes.py
      - tests/test_e022.py
      - .github/workflows/e022-preflight.yml
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local package and focused tooling
        run: python -m pip install -e ".[dev]"
      - name: Lint E022 files only (historical files stay immutable)
        run: ruff check experiments/E022_proper_cycle_colouring_residue_order_shapes.py tests/test_e022.py
      - name: E022 source compilation and independent no-prime tests
        run: |
          python -m compileall -q experiments/E022_proper_cycle_colouring_residue_order_shapes.py tests/test_e022.py
          python -m pytest -q tests/test_e022.py
