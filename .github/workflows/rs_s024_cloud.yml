name: RS-S025 cloud Lean validation

on:
  push:
    branches: [rs-s025-cloud]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rs-s025-cloud
  cancel-in-progress: true

jobs:
  lean-and-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Lean and Mathlib cache
        run: bash formalisation/cloud_setup.sh
      - name: Check both Lean build targets (fail hard)
        working-directory: formalisation
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          set +e
          lake build ReciprocitySpectra > "$GITHUB_WORKSPACE/rs_s025_build.log" 2>&1
          code1=$?
          lake build Checks >> "$GITHUB_WORKSPACE/rs_s025_build.log" 2>&1
          code2=$?
          echo "Lean library exit: $code1, Checks exit: $code2" >> "$GITHUB_WORKSPACE/rs_s025_build.log"
          cat "$GITHUB_WORKSPACE/rs_s025_build.log"
          test "$code1" -eq 0 && test "$code2" -eq 0
      - name: Check for placeholders and unsafe axioms
        run: |
          if grep -R -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' formalisation/ReciprocitySpectra; then
            echo "Found proof placeholder" >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project tests
        run: python -m pip install -e ".[dev]" numpy scipy
      - name: Lint touched files
        run: ruff check reciprocity_spectra/scripts
      - name: Full pytest
        run: pytest
      - name: Export verified native sextic Gauss sums at X=200
        run: python -m reciprocity_spectra.scripts.rs_s024_gauss_check --check
      - name: Frozen evidence audit checkers
        run: |
          python reciprocity_spectra/scripts/audit_strength.py --check
          python reciprocity_spectra/scripts/audit_cand002.py --check

      - name: Preserve cloud Lean diagnostics on the session branch
        if: always()
        run: |
          mkdir -p formalisation/checkpoints
          if [ -f rs_s025_build.log ]; then
            cp rs_s025_build.log formalisation/checkpoints/RS_S025_LEAN_BUILD.txt
          else
            printf 'No Lean build log: preceding environment setup may have failed.\n' > formalisation/checkpoints/RS_S025_LEAN_BUILD.txt
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add formalisation/checkpoints/RS_S025_LEAN_BUILD.txt
          if ! git diff --cached --quiet; then
            git commit -m "RS-S025: preserve cloud Lean validation evidence"
            git push origin HEAD:rs-s025-cloud
          fi
