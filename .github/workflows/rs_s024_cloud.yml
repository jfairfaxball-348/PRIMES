name: RS-S034 cloud Lean and package validation

on:
  push:
    branches: [rs-s034-palomar-prepare, rs-s036-comparator-fidelity]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rs-s034-palomar-prepare
  cancel-in-progress: true

jobs:
  lean-and-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Lean and Mathlib cache
        run: bash formalisation/cloud_setup.sh
      - name: Check Lean library, checks and Palomar modules (fail hard)
        working-directory: formalisation
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          set +e
          lake build ReciprocitySpectra > "$GITHUB_WORKSPACE/rs_s025_build.log" 2>&1
          code1=$?
          lake build Checks >> "$GITHUB_WORKSPACE/rs_s025_build.log" 2>&1
          code2=$?
          lake build Challenge Solution >> "$GITHUB_WORKSPACE/rs_s025_build.log" 2>&1
          code3=$?
          echo "Lean library exit: $code1, Checks exit: $code2, Palomar modules exit: $code3" >> "$GITHUB_WORKSPACE/rs_s025_build.log"
          cat "$GITHUB_WORKSPACE/rs_s025_build.log"
          test "$code1" -eq 0 && test "$code2" -eq 0 && test "$code3" -eq 0
      - name: Check for placeholders and unsafe axioms
        run: |
          if grep -R -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' formalisation/ReciprocitySpectra; then
            echo "Found proof placeholder" >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project tests
        run: python -m pip install -e ".[dev]" numpy scipy
      - name: Lint touched files
        run: ruff check reciprocity_spectra/scripts
      - name: Full pytest
        run: pytest
      - name: Export verified native sextic Gauss sums at X=200
        run: python -m reciprocity_spectra.scripts.rs_s024_gauss_check --check
      - name: Frozen evidence audit checkers
        run: |
          python reciprocity_spectra/scripts/audit_strength.py --check
          python reciprocity_spectra/scripts/audit_cand002.py --check
