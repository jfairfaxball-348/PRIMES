# This metadata is a provenance declaration, not a claim of Palomar registration.
version: "v0.4"
project:
  name: "Finite sextic-residue identities underlying Reciprocity Spectra"
  description: >-
    A formal library of exact finite-field sextic residue-exponent laws in the
    split Eisenstein-prime model, character-level Gauss sum identities and
    additional proved finite row identities. The expanded 26-theorem Challenge covers E0/E1/E2/E3/E5/E6,
    generic character E4/E7, specialised sextic Gauss E4/E7 and finite
    Eisenstein class reduction and frozen full matrix row orientation. It makes no asymptotic claim.
  authors: ["John Fairfax-Ball"]
  responsible_maintainers: ["John Fairfax-Ball"]
  license: "Apache-2.0"
classification:
  arxiv: ["math.NT"]
  msc2020: ["11A15", "11L05"]
sources:
  - title: "PRIMES Reciprocity Spectra exact-identity inventory and verified formal development (RS-S023–RS-S033)"
    type: other
    relationship: formalizes
    location: "https://github.com/jfairfaxball-348/PRIMES"
    note: "In-repository mathematical formulation; no claim of original priority or external peer review."
status:
  scope: >-
    The independent Comparator, NanoDa and Lean kernel accepted all 26 finite
    identities, including specialised sextic E4/E7, Eisenstein numerator
    reduction and the full frozen finite matrix-row identity. After validation,
    the package was merged into main as commit 98c8f54d; post-merge Comparator
    and scoped cloud checks both passed. CAND-002(1)-(3), other asymptotics,
    optional Gram and composite-modulus claims remain unproved or deferred.
    The owner confirms substantial use of OpenAI's ChatGPT in the formalisation,
    disclosed under automation.methods. Palomar has not been submitted to and
    has not issued a registry ID; eligibility, editorial review and registration
    remain separate stages.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
automation:
  methods:
    - method: "agent"
      models: ["OpenAI ChatGPT"]
      framework: "ChatGPT"
      tool_setup: >-
        OpenAI's ChatGPT was used substantially in the Lean 4 formalisation,
        including developing and revising formal definitions, proofs, and
        verification infrastructure. The work used GitHub-connected editing,
        pinned Lean 4/Mathlib, Comparator, lean4export, Landrun, NanoDa, and
        Lean's kernel to check the resulting formalisation independently.
      prompting_notes: >-
        Human-directed iterative sessions asked ChatGPT to formalise exact
        finite sextic identities, repair Lean and exported-constant fidelity
        issues, and preserve the original mathematical statements without
        treating the unproved CAND-002 asymptotic claims as theorems.
  notes: >-
    The author confirms that OpenAI's ChatGPT was used substantially in the
    formalisation. Specific underlying model versions were not consistently
    recorded, so none are asserted here. The human author retains responsibility
    for the work; the independent mechanical verification is reported separately.
review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The 26 selected claims passed Comparator, NanoDa and Lean's kernel on
    post-merge main in run 40566801477, alongside full scoped cloud validation
    in run 40566801479. These are mechanical verification results, not an
    independent human mathematical review. No Palomar review or registration.
fidelity:
  divergences: >-
    Split Eisenstein prime residue fields are explicitly modelled using ZMod p
    and an Eisenstein root. The quotient ring is not constructed from Mathlib.
    The formal CAND-002 asymptotic statements have no proofs.
alignment:
  namespace: "ReciprocitySpectra"
