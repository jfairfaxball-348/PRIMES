# RS-S035 draft: NOT FOR SUBMISSION. Automation declaration awaits owner review.
# No statement of "no AI used" is being made; AI assistance is known to have occurred.
version: "v0.4"
project:
  name: "Finite sextic-residue identities underlying Reciprocity Spectra"
  description: >-
    A formal library of exact finite-field sextic residue-exponent laws in the
    split Eisenstein-prime model, character-level Gauss sum identities and
    additional proved finite row identities. The expanded 26-theorem Challenge covers E0/E1/E2/E3/E5/E6,
    generic character E4/E7, specialised sextic Gauss E4/E7 and finite
    Eisenstein class reduction and frozen full matrix row orientation. It makes no asymptotic claim.
  authors: ["John Fairfax-Ball"]
  responsible_maintainers: ["John Fairfax-Ball"]
  license: "Apache-2.0"
classification:
  arxiv: ["math.NT"]
  msc2020: ["11A15", "11L05"]
sources:
  - title: "PRIMES Reciprocity Spectra exact-identity inventory and verified formal development (RS-S023–RS-S033)"
    type: other
    relationship: formalizes
    location: "https://github.com/jfairfaxball-348/PRIMES"
    note: "In-repository mathematical formulation; no claim of original priority or external peer review."
status:
  scope: >-
    The draft comparator selects 26 finite identities including actual sextic
    Gauss modulus, shifted sum with zero case, Eisenstein numerator reduction,
    and full frozen row identity. Source signature matching alone does not
    establish independent Comparator or NanoDa acceptance. CAND-002(1)-(3), other
    asymptotics, optional Gram and composite-modulus results remain unproved.
    Submission is blocked on independent Comparator and NanoDa acceptance,
    module compilation and accurate owner-reviewed automation disclosure.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
automation:
  methods: [] # PENDING human-authored declaration; intentionally not Palomar-valid.
  notes: >-
    PENDING OWNER DISCLOSURE. AI-assisted work has occurred in the research and
    Lean development. This draft does not assert that no AI was used. Before
    registration, identify material models and methods in automation.methods.
review:
  status: "self-assessed"
  reviewers: []
  notes: "RS-S038 scoped cloud validation 40555785210 passed at code head 62091106, while Comparator 40555785331 cleared exact directShiftedGauss export fidelity but failed next at rationalAddChar. The complete 26-theorem Comparator/NanoDa package is not accepted. No Palomar ID or owner-reviewed automation disclosure."
fidelity:
  divergences: >-
    Split Eisenstein prime residue fields are explicitly modelled using ZMod p
    and an Eisenstein root. The quotient ring is not constructed from Mathlib.
    The formal CAND-002 asymptotic statements have no proofs.
